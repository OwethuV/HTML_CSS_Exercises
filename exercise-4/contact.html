<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OvalXpress - Contact</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous" />

  <!-- Internal CSS -->
  <style>
    .contact-main {
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    form {
      max-width: 60rem;
    }
  </style>
</head>

<body>
  <!-- NAV -->
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">OvalXpress</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="products.html">Products</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="about.html">About Us</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" href="contact.html">Contact Us</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Form -->
  <h1 class="text-center mt-4">Contact Us</h1>
  <main class="contact-main p-4">
    <form class="row g-3">
      <!-- First Name -->
      <div class="col-md-6">
        <label class="form-label">First Name:</label>
        <input type="text" class="form-control" placeholder="Enter your first name" required>
      </div>
      <!-- Last Name -->
      <div class="col-md-6">
        <label class="form-label">Surname:</label>
        <input type="text" class="form-control" placeholder="Enter your surname" required>
      </div>
      <!-- Cellphone -->
      <div class="col-md-6">
        <label class="form-label">Cellphone:</label>
        <input type="tel" class="form-control" placeholder="Enter your cellphone number" required>
      </div>
      <!-- Email -->
      <div class="col-md-6">
        <label class="form-label">Email:</label>
        <input type="email" class="form-control" placeholder="Enter your email address" required>
      </div>
      <!-- Message -->
      <div class="col-md-12">
        <label class="form-label">Message:</label>
        <textarea class="form-control" rows="4" placeholder="Type your message here..." required></textarea>
      </div>

      <div class="col-md-12">
        <div class="alert alert-danger"><i>Please make sure you fill in all fields</i></div>
      </div>

      <!-- Submit Button -->
      <div class="col-md-12 text-center">
        <button type="submit" class="btn btn-primary">Submit</button>
      </div>

    </form>
  </main>

  <!-- Footer -->
  <footer class="text-lg-start bg-dark text muted text-white mt-5">
    <div class="text-center p-4">
      &copy; 2024 OvalXpress. All rights reserved.
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous">
    </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.min.js"
    integrity="sha384-RuyvpeZCxMJCqVUGFI0Do1mQrods/hhxYlcVfGPOfQtPJh0JCw12tUAZ/Mv10S7D" crossorigin="anonymous">
    </script>
</body>

</html>
