<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Spell Generator</title>
  <!-- CSS -->
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #222;
      color: #eee;
      text-align: center;
      padding: 40px 20px;
    }

    h1 {
      margin-bottom: 30px;
    }

    #spellArea {
      background-color: #444;
      border-radius: 10px;
      padding: 40px 20px;
      margin-bottom: 30px;
      min-height: 100px;
      font-size: 20px;
      user-select: none;
    }

    button {
      font-size: 18px;
      padding: 12px 28px;
      margin: 0 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      background-color: #5c67f2;
      color: white;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #3c44b1;
    }

    ul {
      list-style: none;
      padding: 0;
      margin-top: 20px;
    }

    ul li {
      display: inline-block;
      margin: 0 15px;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Welcome to the Magical Spell Generator!</h1>

  <div id="spellArea">Your magical spell will appear here.</div>

  <button id="generateButton">Generate Spell</button>
  <button id="resetButton">Reset</button>

  <ul id="ingredientsList">
    <li>Dragon Scale</li>
    <li>Phoenix Feather</li>
    <li>Unicorn Horn</li>
  </ul>

  <!-- Script -->
  <script src="script.js"></script>
</body>

</html>
